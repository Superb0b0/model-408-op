name: cleanup-old-runs
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = solo elenco, false = cancella (solo dopo autorizzazione)"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Controlla solo le run autorizzabili
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run }}
        run: |
          FILTER='
            .workflow_runs[]
            | select(.status == "completed" and .head_commit != null)
            | select(.id as $id | ([43324883536,43325313604,43325318429,43325323484,43325326821,43325331240,43325339912,43325343595,43325347600,43325354460,43325358330,43325446645,43325450657,43325456685,43325463067,43325468235,43325477794,43325483582,43325488398,43325493094,43325498758,43325595290,43325721225,43325770459,43325775488,43325780709,43325812973,43325905260,43325956918,43326105100,43326289074,43326357216,43326471202,43326474974,43326480702,43326485041,43326489119,43326497792,43326505782,43326511004,43326517727,43326521930,43326528757,43326534795,43326625494,43326629295,43326633918,43326639571,43326647431,43326652600,43326658065,43326663709,43326670407,43326677940,43326809471,43329489920,43329494865,43329501086,43329505770,43329511039,43329517076,43329523557,43329596159,43329603394,43329610408,43329616255,43329621751,43329625662,43329630475,43329711988,43329716722,43329724287,43329727560,43329734133,43329740016,43329744748,43329749179,43329755771,43329761262,43329806938,43329811829,43329817182,43329821883,43329826548,43329837861,43329842237,43329848092,43329851685,43329908460,43329911126,43329916844,43329920677,43329924909,43329936035,43329937983,43329942477,43329948245,43329994815,43330001092,43330005480,43330011001,43330013656,43330022599,43330027363,43330032566,43330039459,43330042085,43330106306,43330112063,43330116873,43330121732,43330127197,43330137290,43330143537,43330148933,43330153941,43330161945,43330213637,43330218405,43330224241,43330230276,43330236315,43330245023,43330249817,43330255996,43330261055,43330266885,43330316995,43330320461,43330326571,43330332213,43330337788,43330346431,43330352964,43330356998,43330363242,43330368158,43330416983,43330421255,43330426339,43330431192,43330435168,43330445692,43330450562,43330455717,43330459510,43330463701,43330512754,43330516769,43330521456,43330526004,43330530817,43330542573,43330545948,43330550338,43330554923,43330611253,43330615268,43330624330,43330633931,43330637714,43330642552,43330647835,43330699