name: cleanup-old-runs
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = solo elenco, false = cancella"
        default: "true"
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancella run con email non noreply
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run }}
        run: |
          FILTER='
            .workflow_runs[]
            | select(.status == "completed" and .head_commit != null)
            | select(.id as $id | ([25611262899,25611355593,25611622363,25612056858,25612138446,25612181148,25612181154,25612210432,25612210439,25612461772,25612461775,25612823749,25612823750,25613038540,25613038547,25616427144,25616443909,25616489841,27384816590,27384894751] | index($id)) != null)
            | .id'
          ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq "$FILTER")
          echo "Run selezionate: $(printf '%s\n' "$ids" | sed '/^$/d' | wc -l)"
          printf '%s\n' "$ids" | sed '/^$/d' | sort -n
          if [ "$DRY" = "false" ]; then
            for id in $ids; do gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "cancellata $id"; done
          else
            echo "Dry run: nessuna cancellazione."
          fi
