name: Voynich research runner
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: voynich-research-runner
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed research gate
        run: python automation/voynich/runner.py
        env:
          VOYNICH_OUTPUT: ${{ runner.temp }}/voynich-run
      - name: Archive run report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voynich-run-${{ github.run_id }}
          path: ${{ runner.temp }}/voynich-run/report.json
          if-no-files-found: warn
          retention-days: 90
